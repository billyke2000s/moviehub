name: Initiate signed MovieHub 1.0.22 release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/initiate-moviehub-1.0.22.yml
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  dispatch-signed-build:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the established signed APK publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run publish-android-launcher.yml --ref main -f version_code=123 -f version_name=1.0.22
          echo 'Dispatched existing signed publisher; it must pass device tests and signing checks before publishing.'
