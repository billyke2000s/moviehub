name: Live provider probe
# Diagnostic only: runs the bundled providers against the real services with the app's own rules
# and limits, and tries to decode a few streams. Results depend on the providers and the runner's
# country, so this never runs on pull requests or blocks a build. Re-run it from the Actions tab.
on:
    push:
        branches: [feature/standalone-provider-engine]
        paths: ['provider-engine/tools/live-probe*.mjs', '.github/workflows/provider-live-probe.yml']
    schedule:
        - cron: "13 */2 * * *" # Diagnostic probes; does not deploy or rewrite providers.
    workflow_dispatch:
    pull_request:
        paths:
            - 'provider-browser/**'
            - 'provider-engine/tools/live-probe*.mjs'
            - 'provider-engine/tools/freeshot.js'
            - 'provider-engine/tools/zlive.js'
            - 'provider-engine/upstream/modules/dlhd/**'
            - 'android-tv-launcher/app/src/main/assets/providers/builtin.json'
            - '.github/workflows/provider-live-probe.yml'
permissions:
    contents: read
jobs:
    probe:
        # The full public engine is sharded so an unresponsive catalogue cannot
        # prevent the other TV providers from being inspected.
        runs-on: ubuntu-latest
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                group:
                    - { name: fast-a, providers: 'freelivesports stirr tcl xumo' }
                    - { name: fast-b, providers: 'lg whale vizio roku' }
                    - { name: fast-c, providers: 'plex tubi samsung localnow' }
                    - { name: sports, providers: 'dlhd zlive freeshot' }
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: "22"
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
            - name: Install ffmpeg
              run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
            - name: Fetch pinned JavaScript interpreter
              run: curl --fail --location --output "$RUNNER_TEMP/rhino.jar" https://repo.maven.apache.org/maven2/org/mozilla/rhino/1.8.0/rhino-1.8.0.jar
            - name: Verify interpreter checksum
              run: echo "e7ff37ec00b4c19ea16f42b5b3a601616d559dbb76e65bc9d094bd6bda2a925d  $RUNNER_TEMP/rhino.jar" | sha256sum --check
            - name: Compile the app's interpreter
              run: |
                  mkdir -p build/provider-tests
                  javac -cp "$RUNNER_TEMP/rhino.jar" -d build/provider-tests android-tv-launcher/app/src/main/java/local/tv/home/{ProviderScript,ProviderCodec,ProviderSignature,ProviderUrls,ProviderSegments}.java android-tv-launcher/tests/ProviderProbeCli.java
            - name: Probe providers
              env:
                  PROVIDERS: ${{ matrix.group.providers }}
                  # At most one live ZLive sample for this PR investigation;
                  # scheduled checks continue avoiding unnecessary ticket churn.
                  ZLIVE_LIVE_TEST: ${{ github.event_name == 'pull_request' && '1' || '0' }}
                  DLHD_HUB_TEST: ${{ github.event_name == 'pull_request' && '1' || '0' }}
              # Matrix groups cover each compiled provider exactly once.
              run: RHINO_JAR="$RUNNER_TEMP/rhino.jar" node provider-engine/tools/live-probe.mjs $PROVIDERS
            - name: Report providers 1-8
              if: always()
              run: node provider-engine/tools/live-probe-report.mjs 0 8
            - name: Report providers 9-16
              if: always()
              run: node provider-engine/tools/live-probe-report.mjs 8 16
            - name: Report providers 17-24
              if: always()
              run: node provider-engine/tools/live-probe-report.mjs 16 24
            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: live-provider-probe-${{ matrix.group.name }}
                  path: |
                      build/provider-tests/live-probe.json
                      build/provider-tests/live-probe.md
                  if-no-files-found: ignore
