name: VOD single-site rendered content and captured source audio
on:
    push:
        branches: [fix/all-vod-site-audit]
        paths:
            - ".github/workflows/vod-evidence-pilot.yml"
            - ".github/scripts/vod-evidence-audit.sh"
            - "android-tv-launcher/tests/review-vod-evidence.py"
            - "android-tv-launcher/app/src/androidTest/java/local/tv/home/VodAuditEvidence.java"
            - "android-tv-launcher/app/src/main/python/moviehub_compat/anymovies_series.py"
            - "android-tv-launcher/app/src/main/python/moviehub_free99/providers/anymovies_co.py"
            - "android-tv-launcher/app/src/main/python/moviehub_scrubs/providers/anymovies_co.py"
            - "android-tv-launcher/app/src/main/python/moviehub_vod.py"
    workflow_dispatch:
concurrency:
    group: vod-evidence-pilot-${{ github.ref }}
    cancel-in-progress: true
permissions:
    contents: read
jobs:
    evidence:
        runs-on: ubuntu-latest
        timeout-minutes: 75
        strategy:
            fail-fast: false
            matrix:
                route:
                    - { provider: "free99:anymovies_co", media: movies, capture: true }
                    - { provider: "free99:anymovies_co", media: series, capture: true }
                    - { provider: "free99:anymovies_co", media: movies, capture: false }
        env:
            ORG_GRADLE_PROJECT_moviehubAbi: x86_64
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - run: python -m pip install Pillow
            - uses: android-actions/setup-android@v4
              with:
                  packages: platform-tools
            - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
            - uses: gradle/actions/setup-gradle@v5
              with:
                  gradle-version: "9.6.0"
            - name: Prepare bounded media-sample decoder
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq ffmpeg
                  sudo chmod 666 /dev/kvm
            - name: Capture rendered video and native media samples
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 28
                  arch: x86_64
                  profile: tv_1080p
                  cores: 4
                  ram-size: 4096M
                  emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
                  disable-animations: true
                  script: |
                      if [ '${{ matrix.route.capture }}' = true ]; then
                          VOD_SOURCE_LIMIT=200 VOD_SAMPLE_SECONDS=20 VOD_STOP_AFTER_VERIFIED=false bash .github/scripts/vod-evidence-audit.sh 0 1 '${{ matrix.route.provider }}' '${{ matrix.route.media }}'
                      else
                          VOD_SOURCE_LIMIT=200 VOD_SAMPLE_SECONDS=20 VOD_STOP_AFTER_VERIFIED=false bash android-tv-launcher/tests/run-live-vod-audit.sh 0 1 '${{ matrix.route.provider }}' '${{ matrix.route.media }}'
                      fi
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: rendered-vod-evidence-${{ strategy.job-index }}-${{ matrix.route.media }}
                  path: |
                      vod-live-audit.jsonl
                      vod-evidence/
                  retention-days: 7
