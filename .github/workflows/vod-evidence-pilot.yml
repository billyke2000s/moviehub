name: VOD rendered content and captured source audio
on:
    push:
        branches: [fix/all-vod-site-audit]
        paths:
            - ".github/workflows/vod-evidence-pilot.yml"
            - ".github/scripts/vod-evidence-audit.sh"
            - "android-tv-launcher/tests/review-vod-evidence.py"
            - "android-tv-launcher/app/src/androidTest/java/local/tv/home/VodAuditEvidence.java"
    workflow_dispatch:
concurrency:
    group: vod-evidence-pilot-${{ github.ref }}
    cancel-in-progress: true
permissions:
    contents: read
jobs:
    evidence:
        runs-on: ubuntu-latest
        timeout-minutes: 35
        strategy:
            fail-fast: false
            matrix:
                route:
                    - { provider: "free99:seriesloaded_ng", media: movies }
                    - { provider: "native:meowtv", media: series }
                    - { provider: "native:vidzee", media: movies }
                    - { provider: "native:vidzee", media: series }
        env:
            ORG_GRADLE_PROJECT_moviehubAbi: x86_64
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - run: python -m pip install Pillow
            - uses: android-actions/setup-android@v4
              with:
                  packages: platform-tools
            - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
            - uses: gradle/actions/setup-gradle@v5
              with:
                  gradle-version: "9.6.0"
            - name: Prepare bounded media-sample decoder
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq ffmpeg
                  sudo chmod 666 /dev/kvm
            - name: Capture rendered video and native media samples
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 28
                  arch: x86_64
                  profile: tv_1080p
                  cores: 4
                  ram-size: 4096M
                  emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
                  disable-animations: true
                  script: VOD_SOURCE_LIMIT=2 VOD_SAMPLE_SECONDS=20 VOD_STOP_AFTER_VERIFIED=false bash .github/scripts/vod-evidence-audit.sh 0 1 '${{ matrix.route.provider }}' '${{ matrix.route.media }}'
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: rendered-vod-evidence-${{ strategy.job-index }}-${{ matrix.route.media }}
                  path: |
                      vod-live-audit.jsonl
                      vod-evidence/
                  retention-days: 7
