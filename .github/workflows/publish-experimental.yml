name: Publish MovieHub Experimental
# Builds the separate "MovieHub Experimental" app (package local.tv.home.experimental) from the
# chosen branch and publishes it to the android-tv-experimental pre-release. It never touches the
# android-tv-latest feed that normal MovieHub installs update from.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Increasing integer version code for the experimental app'
        required: true
      version_name:
        description: 'Visible version, for example exp-1'
        required: true
permissions:
  contents: write
concurrency:
  group: publish-experimental
  cancel-in-progress: false
jobs:
  experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Verify core rules
        run: bash android-tv-launcher/tests/run-core-tests.sh
      - name: Build signed experimental APK and manifest
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_VERSION_CODE: ${{ inputs.version_code }}
          APK_VERSION_NAME: ${{ inputs.version_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,subprocess
          code=int(os.environ['APK_VERSION_CODE'])
          if not 2 < code < 2100000000: raise SystemExit('Version code must be an integer above 2')
          for key in ['APK_KEYSTORE_BASE64','APK_STORE_PASSWORD','APK_KEY_ALIAS','APK_KEY_PASSWORD']:
              if not os.environ.get(key): raise SystemExit('Configure the APK signing secrets before publishing')
          existing=subprocess.run(['gh','release','view','android-tv-experimental','--json','tagName'],capture_output=True)
          if existing.returncode==0:
              subprocess.run(['gh','release','download','android-tv-experimental','--pattern','update.json','--dir',os.environ['RUNNER_TEMP']],check=True)
              previous=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'update.json').read_text())
              if code<=previous['versionCode']: raise SystemExit('Version code must increase')
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'launcher-signing.jks'
          key.write_bytes(base64.b64decode(os.environ['APK_KEYSTORE_BASE64'],validate=True));key.chmod(0o600)
          PY
          export APK_KEYSTORE="$RUNNER_TEMP/launcher-signing.jks"
          gradle -p android-tv-launcher --no-daemon -Pexperimental assembleRelease
          APK=android-tv-launcher/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1)
          echo "$badging"
          echo "$badging" | grep -q "name='local.tv.home.experimental'" || { echo 'Not the experimental package'; exit 1; }
          mkdir -p release-files
          cp "$APK" release-files/moviehub-experimental.apk
          # Same file under the name the in-app updater downloads.
          cp "$APK" release-files/home.apk
          python - <<'PY'
          import hashlib,json,os,pathlib
          apk=pathlib.Path('release-files/home.apk')
          data=dict(packageName='local.tv.home.experimental',versionCode=int(os.environ['APK_VERSION_CODE']),versionName=os.environ['APK_VERSION_NAME'],sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),notes='Experimental build for testing. Your normal MovieHub is separate and unchanged.')
          pathlib.Path('release-files/update.json').write_text(json.dumps(data))
          PY
      - name: Publish experimental assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-tv-experimental >/dev/null 2>&1; then
            gh release create android-tv-experimental --target "$GITHUB_SHA" --prerelease --latest=false --title 'MovieHub Experimental' --notes 'Separate test app (local.tv.home.experimental). Install moviehub-experimental.apk; it does not replace MovieHub.'
          fi
          gh release upload android-tv-experimental release-files/moviehub-experimental.apk release-files/home.apk release-files/update.json --clobber
          gh release edit android-tv-experimental --title "MovieHub Experimental ${{ inputs.version_name }}" --prerelease --latest=false
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/launcher-signing.jks"
