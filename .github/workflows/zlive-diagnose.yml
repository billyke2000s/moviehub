name: ZLive diagnose
# Diagnostic only. Never blocks a build.
on:
    push:
        branches: [diag/zlive-boomerang]
        paths: [".github/workflows/zlive-diagnose.yml", "provider-engine/tools/zlive-*"]
    workflow_dispatch:
permissions:
    contents: read
jobs:
    diagnose:
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: "22"
            - run: node provider-engine/tools/zlive-matrix.mjs
