name: ZLive diagnose
# Diagnostic only. Never blocks a build. Output is encrypted to a one-off session key.
on:
    push:
        branches: [diag/zlive-boomerang]
        paths: [".github/workflows/zlive-diagnose.yml", "provider-engine/tools/zlive-*"]
    workflow_dispatch:
permissions:
    contents: write
jobs:
    diagnose:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: "22"
            - run: |
                  mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null
                  npx playwright install --with-deps chromium >/dev/null
            - run: NODE_PATH=/tmp/pw/node_modules node --experimental-default-type=module -e "process.chdir('$GITHUB_WORKSPACE')" && cp provider-engine/tools/zlive-browser.mjs /tmp/pw/ && (cd /tmp/pw && node zlive-browser.mjs boomerang-uk) ; cp /tmp/pw/diag-* . 2>/dev/null || true
            - run: |
                  mkdir -p diag-out && tar czf z.tgz diag-browser.json diag-shot.png 2>/dev/null || tar czf z.tgz diag-browser.json
                  openssl rand 32 > k.bin
                  openssl enc -aes-256-cbc -pbkdf2 -in z.tgz -out diag-out/b.tgz.enc -pass file:k.bin
                  openssl pkeyutl -encrypt -pubin -inkey provider-engine/tools/diag-pub.pem -in k.bin -out diag-out/b.k.enc
                  rm -f k.bin z.tgz
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git pull -q --rebase && git add diag-out && git commit -m "Diagnostic browser output (encrypted)" && git push
