name: ZLive diagnose
# Diagnostic only. Never blocks a build.
on:
    push:
        branches: [diag/zlive-boomerang]
        paths: [".github/workflows/zlive-diagnose.yml", "provider-engine/tools/zlive-*"]
    workflow_dispatch:
permissions:
    contents: write
jobs:
    diagnose:
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - uses: actions/checkout@v5
            - run: mkdir -p diag-out && bash provider-engine/tools/zlive-fetch.sh
            - run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add diag-out && git commit -m "Diagnostic output (encrypted)" && git push
