name: Publish MovieHub 1.0.15
# One-off owner-authorized dispatch of the standard publisher. No signing logic is duplicated.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-moviehub-1.0.15.yml']
permissions:
  contents: read
  checks: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'billyke2000s/moviehub'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the tested candidate and dispatch the standard publisher
        uses: actions/github-script@v8
        with:
          script: |
            const candidate = '2934cd7824fd665e248903d224f5dac0d49335e0';
            const {owner, repo} = context.repo;
            const {data: comparison} = await github.rest.repos.compareCommits({
              owner, repo, base: candidate, head: context.sha
            });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('Release does not contain the tested candidate');
            }
            const {data: checks} = await github.rest.checks.listForRef({owner, repo, ref: candidate});
            for (const name of ['apk', 'signed-compatibility', 'device-tests', 'experimental-device-tests', 'free-vod-live-probe', 'verify']) {
              if (!checks.check_runs.some(check => check.name === name && check.conclusion === 'success')) {
                throw new Error('Candidate check has not passed: ' + name);
              }
            }
            const {data: main} = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            if (main.commit.sha !== context.sha) throw new Error('Main moved before release dispatch');
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'publish-android-launcher.yml', ref: 'main',
              inputs: {version_code: '115', version_name: '1.0.15'}
            });
            core.notice('Dispatched standard Android publisher for MovieHub 1.0.15 (115)');
