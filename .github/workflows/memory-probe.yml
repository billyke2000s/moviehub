name: Memory probe (2 GB)
# Measures MovieHub Experimental's memory on an Android TV emulator limited to 2 GB of RAM:
# a full live channel refresh with every free service on, paging the guide, and watching a
# channel. Diagnostic only: it never publishes anything. Results are job annotations and the
# job summary; samples are uploaded as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [test/memory-2gb]
permissions:
  contents: read
concurrency:
  group: memory-probe
  cancel-in-progress: true
jobs:
  memory-2gb:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the probe on a 2 GB TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          disable-animations: true
          script: bash android-tv-launcher/tests/run-memory-probe.sh
      - name: Upload memory samples
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: memory-probe-2gb
          path: android-tv-launcher/app/build/reports/memory/
          if-no-files-found: ignore
