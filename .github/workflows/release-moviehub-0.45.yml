name: Publish MovieHub 0.45
on:
  push:
    branches: [release/moviehub-0.45]
permissions:
  contents: read
concurrency:
  group: publish-android-launcher
  cancel-in-progress: true
jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - name: Hold release for repeated native EGL failure
        run: |
          echo 'Release paused: post-merge run 39824605890 repeated the native EGL crash. No upload is authorized from this hold workflow.'
          exit 1
