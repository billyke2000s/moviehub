name: Publish MovieHub 1.0.23 provider-maintenance update
# Explicitly owner-authorised release: only dispatch after the provider PR is merged.
# This file only starts the existing signed publisher; it never signs its own APK.
on:
    push:
        branches: [main]
        paths: [".github/workflows/release-moviehub-1.0.23.yml"]
permissions:
    contents: read
    actions: write
jobs:
    dispatch:
        if: github.repository == 'billyke2000s/moviehub'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Ensure the requested provider fixes were merged
              uses: actions/github-script@v8
              with:
                  script: |
                      const {owner, repo} = context.repo;
                      const {data: main} = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
                      if (main.commit.sha !== context.sha) throw new Error('main changed before publication');
                      const {data: work} = await github.rest.pulls.get({owner, repo, pull_number: 229});
                      if (!work.merged) throw new Error('PR #229 has not merged: refuse to publish an old APK');
                      await github.rest.actions.createWorkflowDispatch({
                        owner, repo, workflow_id: 'publish-android-launcher.yml', ref: 'main',
                        inputs: {version_code: '123', version_name: '1.0.23'}
                      });
                      core.notice('Started the existing signed APK publisher for MovieHub 1.0.23 (code 123)');
    release-page:
        needs: dispatch
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - name: Require successful signed publication of this exact commit
              uses: actions/github-script@v8
              with:
                  script: |
                      const {owner, repo} = context.repo;
                      let passed = false;
                      for (let attempt = 0; attempt < 120; attempt++) {
                        const {data: runs} = await github.rest.actions.listWorkflowRuns({
                          owner, repo, workflow_id: 'publish-android-launcher.yml',
                          head_sha: context.sha, event: 'workflow_dispatch', per_page: 10
                        });
                        const run = runs.workflow_runs.find(run => run.head_sha === context.sha);
                        if (run?.status === 'completed') {
                          if (run.conclusion !== 'success') throw new Error('Signed publication did not pass checks');
                          passed = true;
                          break;
                        }
                        await new Promise(resolve => setTimeout(resolve, 15000));
                      }
                      if (!passed) throw new Error('Signed publication incomplete: no numbered release created');
            - name: Validate the feed version before making a public numbered release
              env:
                  GH_TOKEN: \${{ github.token }}
                  GH_REPO: \${{ github.repository }}
              run: |
                  mkdir -p "$RUNNER_TEMP/moviehub-123-feed"
                  gh release download android-tv-latest --pattern update.json --dir "$RUNNER_TEMP/moviehub-123-feed"
                  python - <<'PY'
                  import json, os, pathlib
                  path = pathlib.Path(os.environ['RUNNER_TEMP'])/'moviehub-123-feed/update.json'
                  manifest = json.loads(path.read_text())
                  if (manifest['packageName'], manifest['versionCode'], manifest['versionName']) != ('local.tv.home', 123, '1.0.23'):
                      raise SystemExit('Updater feed is not the intended MovieHub 1.0.23 build')
                  PY
            - name: Dispatch the standard numbered-release copier
              uses: actions/github-script@v8
              with:
                  script: |
                      const {owner, repo} = context.repo;
                      await github.rest.actions.createWorkflowDispatch({
                        owner, repo, workflow_id: 'release-android-launcher.yml', ref: 'main',
                        inputs: {notes: ''}
                      });
                      core.notice('Started numbered MovieHub 1.0.23 release page creation');
