name: Publish numbered MovieHub 1.0.22 release now
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/number-moviehub-1.0.22-now.yml
permissions:
  actions: write
  contents: read
jobs:
  number-release:
    runs-on: ubuntu-latest
    steps:
      - name: Copy successful signed updater into numbered release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release-android-launcher.yml --ref main
