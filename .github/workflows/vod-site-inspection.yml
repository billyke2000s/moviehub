name: Inspect current VOD public page structure
on:
    push:
        branches: [fix/all-vod-site-audit]
        paths:
            - ".github/workflows/vod-site-inspection.yml"
            - ".github/scripts/vod_site_inspection.py"
            - ".github/scripts/vod_seriesloaded_hops.py"
    workflow_dispatch:
permissions:
    contents: read
jobs:
    inspect:
        runs-on: ubuntu-latest
        timeout-minutes: 6
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - run: python -m pip install requests==2.32.5 six==1.17.0
            - name: Inspect bounded public HTML without logging media URLs
              run: python .github/scripts/vod_site_inspection.py

            - name: Inspect advertised download handoffs without logging file URLs
              run: python .github/scripts/vod_seriesloaded_hops.py
