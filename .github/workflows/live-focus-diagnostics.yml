name: Diagnose live dialog focus
on:
  push:
    branches: [diagnostic/live-focus]
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          script: |
            gradle -p android-tv-launcher --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=local.tv.home.LiveControlsTest
            adb shell dumpsys window windows > android-tv-launcher/app/build/windows.txt
            adb pull /sdcard/Download/moviehub-test-screenshots/ android-tv-launcher/app/build/reports/tv-screenshots/ || true
      - if: always()
        run: python3 android-tv-launcher/tests/report-test-failures.py android-tv-launcher/app/build/outputs/androidTest-results
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: focus-diagnostics
          path: |
            android-tv-launcher/app/build/reports/
            android-tv-launcher/app/build/outputs/androidTest-results/
            android-tv-launcher/app/build/windows.txt
