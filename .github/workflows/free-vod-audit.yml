name: Free VOD provider audit
on:
  push:
    branches: [fix/free-vod-reliability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.5 six==1.17.0
      - name: Verify every bundled adapter and lookup contract
        run: python android-tv-launcher/tests/test_free_vod.py
      - name: Report every provider against a public-domain film
        run: python android-tv-launcher/tests/probe-free-vod.py | tee provider-audit.jsonl
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: free-vod-provider-audit
          path: provider-audit.jsonl
