name: Measure VOD runner with a known 720p fixture
on:
    push:
        branches: [fix/all-vod-site-audit]
        paths:
            - ".github/workflows/vod-runner-calibration.yml"
            - ".github/scripts/vod-runner-calibration.sh"
            - "android-tv-launcher/app/src/androidTest/java/local/tv/home/VodRunnerCalibrationTest.java"
            - "android-tv-launcher/app/src/androidTest/java/local/tv/home/VodSessionPlaybackTest.java"
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: vod-runner-calibration-${{ github.ref }}
    cancel-in-progress: true
jobs:
    measure:
        runs-on: ubuntu-latest
        timeout-minutes: 35
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { canvas: "1920x1080", profile: tv_1080p }
                    - { canvas: "1280x720", profile: tv_720p }
        env:
            ORG_GRADLE_PROJECT_moviehubAbi: x86_64
            VOD_CALIBRATION_CANVAS: ${{ matrix.canvas }}
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - uses: android-actions/setup-android@v4
              with:
                  packages: platform-tools
            - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
            - uses: gradle/actions/setup-gradle@v5
              with:
                  gradle-version: "9.6.0"
            - name: Generate synthetic fixture only in this runner's test assets
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq ffmpeg
                  sudo chmod 666 /dev/kvm
                  ffmpeg -v error -y -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 180 -c:v libx264 -preset veryfast -crf 25 -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -movflags +faststart android-tv-launcher/app/src/androidTest/assets/vod.mp4
            - uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 28
                  arch: x86_64
                  profile: ${{ matrix.profile }}
                  cores: 4
                  ram-size: 4096M
                  emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
                  disable-animations: true
                  script: |
                      adb shell wm size
                      adb shell wm density
                      bash .github/scripts/vod-runner-calibration.sh
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: vod-runner-calibration-${{ matrix.canvas }}
                  path: vod-runner-calibration.json
                  if-no-files-found: warn
                  retention-days: 7
