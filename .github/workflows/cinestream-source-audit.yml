name: CineStream candidate playback evidence
on:
  pull_request:
    paths:
      - 'android-tv-launcher/app/src/main/python/moviehub_native/cinestream*'
      - '.github/workflows/cinestream-source-audit.yml'
      - '.github/scripts/cinestream-audit.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        media: [movies, series]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.5 six==1.17.0
      - name: Trace candidate paths without changing ordinary discovery
        run: |
          args=()
          if [ '${{ matrix.media }}' = series ]; then args+=(--series); fi
          python android-tv-launcher/tests/trace-cinestream.py "${args[@]}" | tee cinestream-protocols.jsonl
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cinestream-protocols-${{ matrix.media }}
          path: cinestream-protocols.jsonl
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        route:
          - {provider: 'native:vaplayer', names: 'VaPlayer'}
          - {provider: 'native:hexa', names: 'Hexa'}
        media: [movies, series]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check native decoding, audio, duration and midpoint seeking
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          script: bash .github/scripts/cinestream-audit.sh '${{ matrix.route.provider }}' '${{ matrix.media }}' '${{ matrix.route.names }}'
      - name: Summarize actual outcomes without asserting universal availability
        if: always()
        run: |
          python - <<'PY'
          import collections, json, pathlib
          path = pathlib.Path('vod-live-audit.jsonl')
          if not path.exists():
              raise SystemExit('No playback report produced')
          rows = [json.loads(line) for line in path.read_text().splitlines()]
          print(json.dumps(dict(outcomes=dict(collections.Counter(row.get('status') for row in rows if row.get('kind') == 'playback')))))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cinestream-playback-${{ strategy.job-index }}-${{ matrix.media }}
          path: |
            vod-live-audit.jsonl
            cinestream-crash.log
          if-no-files-found: warn
