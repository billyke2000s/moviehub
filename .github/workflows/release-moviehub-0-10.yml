name: Publish MovieHub 0.10 signed release
on:
  push:
    branches: [release/moviehub-0.10]
    paths: ['.github/workflows/release-moviehub-0-10.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-android-launcher
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify core rules
        run: |
          mkdir -p build/core-tests
          javac -d build/core-tests android-tv-launcher/app/src/main/java/local/tv/home/{Playlist,Network,VideoFiles,ChannelQuery}.java android-tv-launcher/tests/{PlaylistTest,NetworkTest,VideoFilesTest,ChannelQueryTest}.java
          for test in PlaylistTest NetworkTest VideoFilesTest ChannelQueryTest; do java -Xmx64m -cp build/core-tests local.tv.home.$test; done
      - name: Verify completed emulator checks for identical app source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True))
          run=api('actions/runs/38995882744')
          if run['head_sha']!='2629c4ed597e112089ed3e54f49604170dbe8a50': raise SystemExit('Unexpected tested commit')
          jobs=api('actions/runs/38995882744/jobs')['jobs']
          if not any(step['name']=='Verify database upgrades and channel imports on Android' and step['conclusion']=='success' for job in jobs for step in job['steps']): raise SystemExit('Emulator checks did not pass')
          comparison=api('compare/'+run['head_sha']+'...'+os.environ['GITHUB_SHA'])
          if any(file['filename']!='.github/workflows/release-moviehub-0-10.yml' for file in comparison['files']): raise SystemExit('App source changed after emulator verification')
          print('All 24 emulator tests already passed for identical app source. Only the release workflow changed.')
          PY
      - name: Build signed release and update manifest
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_VERSION_CODE: '10'
          APK_VERSION_NAME: '0.10'
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,subprocess
          code=int(os.environ['APK_VERSION_CODE'])
          if not 2 < code < 2100000000: raise SystemExit('Version code must be an integer above 2')
          for key in ['APK_KEYSTORE_BASE64','APK_STORE_PASSWORD','APK_KEY_ALIAS','APK_KEY_PASSWORD']:
              if not os.environ.get(key): raise SystemExit('Configure the APK signing secrets before publishing')
          existing=subprocess.run(['gh','release','view','android-tv-latest','--json','tagName'],capture_output=True)
          if existing.returncode==0:
              subprocess.run(['gh','release','download','android-tv-latest','--pattern','update.json','--dir',os.environ['RUNNER_TEMP']],check=True)
              previous=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'update.json').read_text())
              subprocess.run(['gh','release','download','android-tv-latest','--pattern','home.apk','--dir',os.environ['RUNNER_TEMP']],check=True)
              if code<=previous['versionCode']: raise SystemExit('Version code must increase')
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'launcher-signing.jks'
          key.write_bytes(base64.b64decode(os.environ['APK_KEYSTORE_BASE64'],validate=True));key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write('APK_KEYSTORE='+str(key)+'\n')
          PY
          export APK_KEYSTORE="$RUNNER_TEMP/launcher-signing.jks"
          gradle -p android-tv-launcher --no-daemon assembleRelease lintRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-tv-launcher/app/build/outputs/apk/release/app-release.apk
          python - <<'PYVERIFY'
          import os,pathlib,subprocess,re,hashlib,json
          previous=pathlib.Path(os.environ['RUNNER_TEMP'])/'home.apk'
          current=pathlib.Path('android-tv-launcher/app/build/outputs/apk/release/app-release.apk')
          if previous.exists():
              manifest=json.loads((previous.parent/'update.json').read_text())
              if hashlib.sha256(previous.read_bytes()).hexdigest()!=manifest['sha256']: raise SystemExit('Published baseline checksum mismatch')
              signer=str(pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0/apksigner')
              def certificates(apk):
                  result=subprocess.check_output([signer,'verify','--print-certs',str(apk)],text=True)
                  return set(re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)',result))
              old,new=certificates(previous),certificates(current)
              if not old or old!=new: raise SystemExit('Signing key differs from installed updater baseline')
          PYVERIFY
          mkdir -p release-files
          cp android-tv-launcher/app/build/outputs/apk/release/app-release.apk release-files/home.apk
          python - <<'PY'
          import hashlib,json,os,pathlib
          apk=pathlib.Path('release-files/home.apk')
          data=dict(packageName='local.tv.home',versionCode=int(os.environ['APK_VERSION_CODE']),versionName=os.environ['APK_VERSION_NAME'],sha256=hashlib.sha256(apk.read_bytes()).hexdigest())
          pathlib.Path('release-files/update.json').write_text(json.dumps(data))
          PY
      - name: Publish versioned APK and compatible updater assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/moviehub-release-notes.md" <<'NOTES'
          MovieHub 0.10 (version code 10)
          
          - Fix blank artwork when scrolling Home and recycled poster grids. Start requests when cards attach, deduplicate downloads, preserve visible requests instead of discarding them, retry temporary failures, and reject late artwork for rebound cards.
          - Movies and Series now open on Trending today. Back from this entry screen returns Home.
          - Rework the catalogue sidebar into Search, Discover, Explore and Library sections with left-aligned labels and a clear active category. Keep all genres and filters and Right-to-nearest-poster navigation.
          
          Verification: debug/release builds, lint, 45 core checks, 24 emulator tests and signed updater compatibility passed before publication. New artwork regressions cover detached binding, stale-image rejection, requests beyond the previous queue limit, temporary failure retry and actual D-pad navigation across 60 recycled posters and back. Existing pagination, title scrolling, playback, migration and provider fixture tests remain included. Final sidebar screenshots were inspected.
          
          Known verification limits: authenticated live provider/TMDB calls and installation on the target TV remain unverified. Artwork regressions use generated bitmaps through the production loader; the navigation screenshot fixture also exercises real TMDB artwork downloads.
          
          Install home.apk over the previous signed MovieHub release. Existing accounts, settings, favourites, sources and app pins are retained. The package and signing certificate are unchanged, and the updater continues to use android-tv-latest/home.apk and update.json.
          NOTES
          gh release create moviehub-v0.10 release-files/home.apk release-files/update.json --target "$GITHUB_SHA" --title 'MovieHub 0.10' --notes-file "$RUNNER_TEMP/moviehub-release-notes.md"
          gh release edit android-tv-latest --title 'MovieHub 0.10 — updater feed' --notes-file "$RUNNER_TEMP/moviehub-release-notes.md"
          gh release upload android-tv-latest release-files/home.apk --clobber
          gh release upload android-tv-latest release-files/update.json --clobber
      - name: Verify published downloads and updater compatibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download moviehub-v0.10 --pattern home.apk --pattern update.json --dir "$RUNNER_TEMP/published-version"
          gh release download android-tv-latest --pattern home.apk --pattern update.json --dir "$RUNNER_TEMP/published-updater"
          python - <<'PYPOST'
          import pathlib,json,hashlib,subprocess,os,re
          expected=json.loads(pathlib.Path('release-files/update.json').read_text())
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          for name in ['published-version','published-updater']:
              folder=pathlib.Path(os.environ['RUNNER_TEMP'])/name
              manifest=json.loads((folder/'update.json').read_text())
              apk=folder/'home.apk'
              if manifest!=expected or hashlib.sha256(apk.read_bytes()).hexdigest()!=expected['sha256']: raise SystemExit('Published APK or updater manifest mismatch')
              signing=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(apk)],text=True)
              cert=set(re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)',signing))
              if cert!={'732e19f47c559bb053daac6be7b7b0afa0aae3ea23b3c392e42126e2d3928dfa'}: raise SystemExit('Published signing certificate mismatch')
              badging=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
              if not re.search(r"package: name='local.tv.home' versionCode='10' versionName='0.10'",badging): raise SystemExit('Published package/version mismatch')
              print(name,expected['sha256'],'package, version, checksum and signing certificate verified')
          PYPOST
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moviehub-0.10-device-tests
          path: |
            android-tv-launcher/app/build/reports/androidTests/
            android-tv-launcher/app/build/reports/tv-screenshots/
          if-no-files-found: ignore
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/launcher-signing.jks"
