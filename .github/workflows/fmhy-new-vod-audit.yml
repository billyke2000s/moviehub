name: Audit new FMHY movie sources
on:
    push:
        branches: [main]
        paths:
            - "android-tv-launcher/app/src/main/python/moviehub_native/rive.py"
            - "android-tv-launcher/app/src/main/python/moviehub_native/__init__.py"
            - ".github/workflows/fmhy-new-vod-audit.yml"
    workflow_dispatch:
permissions:
    contents: read
jobs:
    decode:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                shard: [0]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - uses: android-actions/setup-android@v4
              with:
                  packages: "platform-tools"
            - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;36.0.0'
            - uses: gradle/actions/setup-gradle@v5
              with:
                  gradle-version: "9.6.0"
            - name: Enable emulator acceleration
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Decode individual sources through the packaged Android player
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 28
                  arch: x86_64
                  profile: tv_1080p
                  disable-animations: true
                  script: bash android-tv-launcher/tests/run-live-vod-audit.sh 0 1 native:rive
            - name: Require every returned link to pass video, audio, runtime and midpoint checks
              run: |
                  python - <<'PYTHON'
                  import json
                  from pathlib import Path
                  rows = [json.loads(line) for line in Path('vod-live-audit.jsonl').read_text().splitlines()]
                  links = [row for row in rows if row.get('kind') == 'playback']
                  if not links:
                      raise SystemExit('No newly added source returned links: verification incomplete')
                  failed = [row for row in links if row.get('website') != 'native:rive' or row.get('status') != 'verified' or not row.get('separateSource')]
                  if failed:
                      raise SystemExit(f'{len(failed)} of {len(links)} new links failed verification; inspect the redacted artifact')
                  print(f'All {len(links)} returned new-provider links passed individual playback checks')
                  PYTHON
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: fmhy-new-source-audit-${{ matrix.shard }}
                  path: vod-live-audit.jsonl
                  if-no-files-found: warn
