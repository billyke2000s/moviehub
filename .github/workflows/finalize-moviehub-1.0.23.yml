name: Finalize published MovieHub 1.0.23 numbered release
# The normal signed publisher already succeeded. This must not rebuild or overwrite the APK.
on:
    push:
        branches: [main]
        paths: [".github/workflows/finalize-moviehub-1.0.23.yml"]
permissions:
    actions: write
    contents: read
jobs:
    verify-and-number:
        if: github.repository == 'billyke2000s/moviehub'
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - name: Require successful signed publisher and existing APK assets
              uses: actions/github-script@v8
              with:
                  script: |
                      const {owner,repo} = context.repo;
                      const {data:run} = await github.rest.actions.getWorkflowRun({
                        owner,repo,run_id:44979954791
                      });
                      if (run.conclusion !== 'success' ||
                          run.head_sha !== 'ba8a8023ed47566cc39c8a0114d8ea014b226857')
                        throw new Error('The exact signed 1.0.23 publisher did not succeed');
                      const {data:release} = await github.rest.repos.getReleaseByTag({
                        owner,repo,tag:'android-tv-latest'
                      });
                      for (const name of ['home.apk','update.json'])
                        if (!release.assets.some(asset => asset.name === name && asset.size > 0))
                          throw new Error('Missing signed updater asset: ' + name);
            - name: Check the already-published version manifest
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  mkdir -p "$RUNNER_TEMP/moviehub-124-feed"
                  gh release download android-tv-latest --pattern update.json --dir "$RUNNER_TEMP/moviehub-124-feed"
                  python3 - <<'PY'
                  import json,os,pathlib
                  manifest=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'moviehub-124-feed/update.json').read_text())
                  required=('local.tv.home',124,'1.0.23')
                  actual=(manifest['packageName'],manifest['versionCode'],manifest['versionName'])
                  if actual != required: raise SystemExit(f'Unexpected updater version: {actual!r}')
                  if not isinstance(manifest.get('sha256'),str) or len(manifest['sha256']) != 64:
                      raise SystemExit('Update manifest missing SHA-256')
                  print('Verified MovieHub 1.0.23 code 124 in published signed update feed')
                  PY
            - name: Dispatch existing checksum-verified numbered-release copier
              uses: actions/github-script@v8
              with:
                  script: |
                      const {owner,repo}=context.repo;
                      await github.rest.actions.createWorkflowDispatch({
                        owner,repo,workflow_id:'release-android-launcher.yml',ref:'main',
                        inputs:{notes:''}
                      });
                      core.notice('Dispatched existing numbered-release copier for signed MovieHub 1.0.23');
