name: Every enabled VOD site — movies and series
on:
    push:
        branches: [fix/all-vod-site-audit]
        paths: ["android-tv-launcher/**", ".github/workflows/all-vod-sites-audit.yml"]
    workflow_dispatch:
permissions:
    contents: read
jobs:
    lookup:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - run: python -m pip install requests==2.32.5 six==1.17.0
            - name: Check every enabled site for both media types
              run: python android-tv-launcher/tests/audit-all-vod-sites.py | tee all-site-lookups.jsonl
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: all-site-lookups
                  path: all-site-lookups.jsonl
    decode:
        runs-on: ubuntu-latest
        timeout-minutes: 75
        strategy:
            fail-fast: false
            matrix:
                shard: [0, 1, 2, 3, 4, 5, 6, 7]
                media: [movies, series]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - uses: android-actions/setup-android@v4
              with:
                  packages: platform-tools
            - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
            - uses: gradle/actions/setup-gradle@v5
              with:
                  gradle-version: "9.6.0"
            - name: Enable emulator acceleration
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Check native decoding, audio, duration and midpoint seeking
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 28
                  arch: x86_64
                  profile: tv_1080p
                  disable-animations: true
                  script: ORG_GRADLE_PROJECT_moviehubAbi=x86_64 VOD_SOURCE_LIMIT=3 VOD_SAMPLE_SECONDS=20 VOD_STOP_AFTER_VERIFIED=true bash android-tv-launcher/tests/run-live-vod-audit.sh '${{ matrix.shard }}' 8 '' '${{ matrix.media }}' ''

            - name: Verify coverage and summarize playback evidence
              if: always()
              run: |
                  python - '${{ matrix.shard }}' <<'PYCODE'
                  import collections, json, pathlib, sys
                  rows = [json.loads(line) for line in pathlib.Path('vod-live-audit.jsonl').read_text().splitlines()]
                  inventory = next(row for row in rows if row['kind'] == 'inventory')
                  wanted = inventory['sites'][int(sys.argv[1])::8]
                  completed = [row['website'] for row in rows if row['kind'] == 'site_finished']
                  if completed != wanted or rows[-1] != dict(kind='finished', shard=int(sys.argv[1]), shards=8):
                      raise SystemExit('Incomplete site coverage')
                  print(json.dumps(dict(media=inventory['media'], sites=len(completed),
                      outcomes=dict(collections.Counter(row.get('status') for row in rows if row['kind'] == 'playback')),
                      verifiedSites=sum(row.get('verified', False) for row in rows if row['kind'] == 'site_finished'))))
                  PYCODE
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: all-site-playback-${{ matrix.media }}-${{ matrix.shard }}
                  path: vod-live-audit.jsonl
                  if-no-files-found: warn
