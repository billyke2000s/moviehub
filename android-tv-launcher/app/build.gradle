plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'local.tv.home'
    compileSdk 35
    defaultConfig { applicationId 'local.tv.home'; minSdk 28; targetSdk 35; versionCode Integer.parseInt(System.getenv('APK_VERSION_CODE') ?: '2'); versionName System.getenv('APK_VERSION_NAME') ?: '0.2' }
    defaultConfig { ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' } }
    defaultConfig { testInstrumentationRunner 'local.tv.home.MovieHubTestRunner' }
    signingConfigs {
        release {
            if (System.getenv('APK_KEYSTORE')) {
                storeFile file(System.getenv('APK_KEYSTORE'))
                storePassword System.getenv('APK_STORE_PASSWORD')
                keyAlias System.getenv('APK_KEY_ALIAS')
                keyPassword System.getenv('APK_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { if (System.getenv('APK_KEYSTORE')) signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'org.mozilla:rhino:1.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    implementation 'org.videolan.android:libvlc-all:3.7.0'
    implementation 'androidx.work:work-runtime:2.12.0'
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            install 'requests==2.32.5'
            install 'six==1.17.0'
        }
    }
}
