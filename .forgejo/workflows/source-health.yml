name: Source health
# Runs on your home server (Forgejo runner labelled "moviehub", host mode), so sites are tested from a
# UK home connection like the family's boxes. Live TV every hour (a failing source is re-tested
# 5 minutes later before it counts); films every 6 hours. Tracks "[broken source]" issues and
# pings your phone. Never changes code or publishes anything. GitHub ignores this folder.
on:
    schedule:
        - cron: "17 * * * *"
    workflow_dispatch:
concurrency:
    group: source-health
    cancel-in-progress: false
jobs:
    check:
        runs-on: moviehub
        timeout-minutes: 55
        steps:
            - uses: actions/checkout@v4
            - name: Compile the app's JavaScript interpreter for the Live TV probe
              shell: bash
              env:
                  RHINO_JAR: /srv/moviehub/tools/rhino-1.8.0.jar
              run: |
                  mkdir -p build/provider-tests
                  javac -cp "$RHINO_JAR" -d build/provider-tests android-tv-launcher/app/src/main/java/local/tv/home/{ProviderScript,ProviderCodec,ProviderSignature,ProviderUrls,ProviderSegments}.java android-tv-launcher/tests/ProviderProbeCli.java
            - name: Check every source and update issues
              env:
                  RHINO_JAR: /srv/moviehub/tools/rhino-1.8.0.jar
                  FORGEJO_URL: ${{ vars.MOVIEHUB_FORGEJO_URL }}
                  FORGEJO_REPO: ${{ github.repository }}
                  FORGEJO_TOKEN: ${{ secrets.HEALTH_TOKEN }}
                  NTFY_URL: ${{ secrets.NTFY_URL }}
              run: |
                  # Films only every 6 hours (00:17, 06:17, 12:17, 18:17) or when run by hand.
                  hour=$(date +%H)
                  if [ "${{ github.event_name }}" = schedule ] && [ $((10#$hour % 6)) -ne 0 ]; then export SKIP_VOD=1; fi
                  python3 server/health/check_sources.py
